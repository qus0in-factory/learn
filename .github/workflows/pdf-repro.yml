name: PDF reproducibility
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['scripts/learn-pdf/**', 'docs/lecture/**', '.github/workflows/pdf-repro.yml']
concurrency:
  group: pdf-repro-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pdf:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils unzip
      - run: bash scripts/learn-pdf-ops/ci-bootstrap.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-repro-${{ github.sha }}
          path: dist/learn-pdfs
          retention-days: 3
