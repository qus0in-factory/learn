<svg id="areas" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 888.234375px;" viewBox="4 4 888.234375 115.59375" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#areas{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#areas .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#areas .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#areas .error-icon{fill:hsl(30, 50%, 100%);}#areas .error-text{fill:#000000;stroke:#000000;}#areas .edge-thickness-normal{stroke-width:1px;}#areas .edge-thickness-thick{stroke-width:3.5px;}#areas .edge-pattern-solid{stroke-dasharray:0;}#areas .edge-thickness-invisible{stroke-width:0;fill:none;}#areas .edge-pattern-dashed{stroke-dasharray:3;}#areas .edge-pattern-dotted{stroke-dasharray:2;}#areas .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#areas .marker.cross{stroke:rgb(22, 78, 137);}#areas svg{font-family:Learn Sans;font-size:30px;}#areas p{margin:0;}#areas .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#areas .cluster-label text{fill:#000000;}#areas .cluster-label span{color:#000000;}#areas .cluster-label span p{background-color:transparent;}#areas .label text,#areas span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#areas .node rect,#areas .node circle,#areas .node ellipse,#areas .node polygon,#areas .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#areas .rough-node .label text,#areas .node .label text,#areas .image-shape .label,#areas .icon-shape .label{text-anchor:middle;}#areas .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#areas .rough-node .label,#areas .node .label,#areas .image-shape .label,#areas .icon-shape .label{text-align:center;}#areas .node.clickable{cursor:pointer;}#areas .root .anchor path{fill:rgb(22, 78, 137)!important;stroke-width:0;stroke:rgb(22, 78, 137);}#areas .arrowheadPath{fill:#0b0b0b;}#areas .edgePaths .path{stroke:rgb(22, 78, 137);stroke-width:1px;}#areas .flowchart-link{stroke:rgb(22, 78, 137);fill:none;}#areas .edgeLabel{background-color:rgb(255, 255, 255);text-align:center;}#areas .edgeLabel p{background-color:rgb(255, 255, 255);}#areas .edgeLabel rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#areas .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#areas .cluster rect{fill:hsl(30, 50%, 100%);stroke:hsl(30, 10%, 90%);stroke-width:1px;}#areas .cluster text{fill:#000000;}#areas .cluster span{color:#000000;}#areas .node .collapsed-indicator{fill:hsl(30, 10%, 90%);stroke:none;opacity:0.6;}#areas .node .collapsed-separator{stroke:hsl(30, 10%, 90%);stroke-width:0.75px;}#areas div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Learn Sans;font-size:12px;background:hsl(30, 50%, 100%);border:1px solid hsl(30, 10%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#areas .flowchartTitleText{text-anchor:middle;font-size:18px;fill:rgb(23, 43, 70);}#areas rect.text{fill:none;stroke-width:0;}#areas .icon-shape,#areas .image-shape{background-color:rgb(255, 255, 255);text-align:center;}#areas .icon-shape p,#areas .image-shape p{background-color:rgb(255, 255, 255);padding:2px;}#areas .icon-shape .label rect,#areas .image-shape .label rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#areas .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#areas .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#areas .node .neo-node{stroke:rgb(22, 78, 137);}#areas [data-look="neo"].node rect,#areas [data-look="neo"].cluster rect,#areas [data-look="neo"].node polygon{stroke:url(#areas-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#areas [data-look="neo"].swimlane.cluster rect{filter:none;}#areas [data-look="neo"].node path{stroke:url(#areas-gradient);stroke-width:1px;}#areas [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#areas [data-look="neo"].node .neo-line path{stroke:rgb(22, 78, 137);filter:none;}#areas [data-look="neo"].node circle{stroke:url(#areas-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#areas [data-look="neo"].node circle .state-start{fill:#000000;}#areas [data-look="neo"].icon-shape .icon{fill:url(#areas-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#areas [data-look="neo"].icon-shape .icon-neo path{stroke:url(#areas-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#areas :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="areas_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="areas_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="areas_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></path></marker><marker id="areas_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,