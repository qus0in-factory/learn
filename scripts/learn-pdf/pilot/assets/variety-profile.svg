<svg id="variety-profile" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 545.921875px;" viewBox="0 0 545.921875 201.59375" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#variety-profile{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#variety-profile .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#variety-profile .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#variety-profile .error-icon{fill:hsl(30, 50%, 100%);}#variety-profile .error-text{fill:#000000;stroke:#000000;}#variety-profile .edge-thickness-normal{stroke-width:1px;}#variety-profile .edge-thickness-thick{stroke-width:3.5px;}#variety-profile .edge-pattern-solid{stroke-dasharray:0;}#variety-profile .edge-thickness-invisible{stroke-width:0;fill:none;}#variety-profile .edge-pattern-dashed{stroke-dasharray:3;}#variety-profile .edge-pattern-dotted{stroke-dasharray:2;}#variety-profile .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#variety-profile .marker.cross{stroke:rgb(22, 78, 137);}#variety-profile svg{font-family:Learn Sans;font-size:30px;}#variety-profile p{margin:0;}#variety-profile .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#variety-profile .cluster-label text{fill:#000000;}#variety-profile .cluster-label span{color:#000000;}#variety-profile .cluster-label span p{background-color:transparent;}#variety-profile .label text,#variety-profile span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#variety-profile .node rect,#variety-profile .node circle,#variety-profile .node ellipse,#variety-profile .node polygon,#variety-profile .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#variety-profile .rough-node .label text,#variety-p