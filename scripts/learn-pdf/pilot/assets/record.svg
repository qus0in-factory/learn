<svg id="record" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 552px;" viewBox="4 4 552 77.796875" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#record{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#record .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#record .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#record .error-icon{fill:hsl(30, 50%, 100%);}#record .error-text{fill:#000000;stroke:#000000;}#record .edge-thickness-normal{stroke-width:1px;}#record .edge-thickness-thick{stroke-width:3.5px;}#record .edge-pattern-solid{stroke-dasharray:0;}#record .edge-thickness-invisible{stroke-width:0;fill:none;}#record .edge-pattern-dashed{stroke-dasharray:3;}#record .edge-pattern-dotted{stroke-dasharray:2;}#record .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#record .marker.cross{stroke:rgb(22, 78, 137);}#record svg{font-family:Learn Sans;font-size:30px;}#record p{margin:0;}#record .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#record .cluster-label text{fill:#000000;}#record .cluster-label span{color:#000000;}#record .cluster-label span p{background-color:transparent;}#record .label text,#record span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#record .node rect,#record .node circle,#record .node ellipse,#record .node polygon,#record .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#record .rough-node .label text,#record .node .label text,#record .image-shape .label,#record .icon-shape .label{text-anchor:middle;}#record .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#record .rough-node .label,#record .node .label,#record .image-shape .label,#record .icon-shape .label{text-align:center;}#record .node.clickable{cursor:pointer;}#record .root .anchor path{fill:rgb(22, 78, 137)!important;stroke-width:0;stroke:rgb(22, 78, 137);}#record .arrowheadPath{fill:#0b0b0b;}#record .edgePaths .path{stroke:rgb(22, 78, 137);stroke-width:1px;}#record .flowchart-link{stroke:rgb(22, 78, 137);fill:none;}#record .edgeLabel{background-color:rgb(255, 255, 255);text-align:center;}#record .edgeLabel p{background-color:rgb(255, 255, 255);}#record .edgeLabel rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#record .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#record .cluster rect{fill:hsl(30, 50%, 100%);stroke:hsl(30, 10%, 90%);stroke-width:1px;}#record .cluster text{fill:#000000;}#record .cluster span{color:#000000;}#record .node .collapsed-indicator{fill:hsl(30, 10%, 90%);stroke:none;opacity:0.6;}#record .node .collapsed-separator{stroke:hsl(30, 10%, 90%);stroke-width:0.75px;}#record div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Learn Sans;font-size:12px;background:hsl(30, 50%, 100%);border:1px solid hsl(30, 10%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#record .flowchartTitleText{text-anchor:middle;font-size:18px;fill:rgb(23, 43, 70);}#record rect.text{fill:none;stroke-width:0;}#record .icon-shape,#record .image-shape{background-color:rgb(255, 255, 255);text-align:center;}#record .icon-shape p,#record .image-shape p{background-color:rgb(255, 255, 255);padding:2px;}#record .icon-shape .label rect,#record .image-shape .label rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#record .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#record .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#record .node .neo-node{stroke:rgb(22, 78, 137);}#record [data-look="neo"].node rect,#record [data-look="neo"].cluster rect,#record [data-look="neo"].node polygon{stroke:url(#record-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#record [data-look="neo"].swimlane.cluster rect{filter:none;}#record [data-look="neo"].node path{stroke:url(#record-gradient);stroke-width:1px;}#record [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#record [data-look="neo"].node .neo-line path{stroke:rgb(22, 78, 137);filter:none;}#record [data-look="neo"].node circle{stroke:url(#record-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#record [data-look="neo"].node circle .state-start{fill:#000000;}#record [data-look="neo"].icon-shape .icon{fill:url(#record-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#record [data-look="neo"].icon-shape .icon-neo path{stroke:url(#record-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#record :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="record_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="record_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="record_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></path></marker><marker id="record_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" m