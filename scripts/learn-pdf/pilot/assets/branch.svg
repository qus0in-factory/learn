<svg id="branch" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 552px;" viewBox="4 4 552 179.59375" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#branch{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#branch .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#branch .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#branch .error-icon{fill:hsl(30, 50%, 100%);}#branch .error-text{fill:#000000;stroke:#000000;}#branch .edge-thickness-normal{stroke-width:1px;}#branch .edge-thickness-thick{stroke-width:3.5px;}#branch .edge-pattern-solid{stroke-dasharray:0;}#branch .edge-thickness-invisible{stroke-width:0;fill:none;}#branch .edge-pattern-dashed{stroke-dasharray:3;}#branch .edge-pattern-dotted{stroke-dasharray:2;}#branch .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#branch .marker.cross{stroke:rgb(22, 78, 137);}#branch svg{font-family:Learn Sans;font-size:30px;}#branch p{margin:0;}#branch .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#branch .cluster-label text{fill:#000000;}#branch .cluster-label span{color:#000000;}#branch .cluster-label span p{background-color:transparent;}#branch .label text,#branch span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#branch .node rect,#branch .node circle,#branch .node ellipse,#branch .node polygon,#branch .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#branch .rough-node .label text,#branch .node .label text,#branch .image-shape .label,#branch .icon-shape .label{text-anchor:middle;}#branch .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#branch .rough-node .label,#branch .node .label,#branch .image-shape .label,#branch .icon-shape .label{text-a