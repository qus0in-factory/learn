<svg id="docs-flow" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 744px;" viewBox="4 4 744 77.796875" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#docs-flow{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#docs-flow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#docs-flow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#docs-flow .error-icon{fill:hsl(30, 50%, 100%);}#docs-flow .error-text{fill:#000000;stroke:#000000;}#docs-flow .edge-thickness-normal{stroke-width:1px;}#docs-flow .edge-thickness-thick{stroke-width:3.5px;}#docs-flow .edge-pattern-solid{stroke-dasharray:0;}#docs-flow .edge-thickness-invisible{stroke-width:0;fill:none;}#docs-flow .edge-pattern-dashed{stroke-dasharray:3;}#docs-flow .edge-pattern-dotted{stroke-dasharray:2;}#docs-flow .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#docs-flow .marker.cross{stroke:rgb(22, 78, 137);}#docs-flow svg{font-family:Learn Sans;font-size:30px;}#docs-flow p{margin:0;}#docs-flow .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#docs-flow .cluster-label text{fill:#000000;}#docs-flow .cluster-label span{color:#000000;}#docs-flow .cluster-label span p{background-color:transparent;}#docs-flow .label text,#docs-flow span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#docs-flow .node rect,#docs-flow .node circle,#docs-flow .node ellipse,#docs-flow .node polygon,#docs-flow .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#docs-flow .rough-node .label text,#docs-flow .node .label text,#docs-flow .image-shape .label,#docs-flow .icon-shape .label{text-anchor:middle;}#docs-flow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#docs-flow .rough-node .label,#docs-flow .node .label,#docs-flow .image-shape .label,#docs-flow .icon-shape .label{text-align:center;}#docs-flow .node.clickable{cursor:pointer;}#docs-flow .root .anchor path{fill:rgb(22, 78, 137)!important;stroke-width:0;stroke:rgb(22, 78, 137);}#docs-flow .arrowheadPath{fill:#0b0b0b;}#docs-flow .edgePaths .path{stroke:rgb(22, 78, 137);stroke-width:1px;}#docs-flow .flowchart-link{stroke:rgb(22, 78, 137);fill:none;}#docs-flow .edgeLabel{background-color:rgb(255, 255, 255);text-align:center;}#docs-flow .edgeLabel p{background-color:rgb(255, 255, 255);}#docs-flow .edgeLabel rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#docs-flow .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#docs-flow .cluster rect{fill:hsl(30, 50%, 100%);stroke:hsl(30, 10%, 90%);stroke-width:1px;}#docs-flow .cluster text{fill:#000000;}#docs-flow .cluster span{color:#000000;}#docs-flow .node .collapsed-indicator{fill:hsl(30, 10%, 90%);stroke:none;opacity:0.6;}#docs-flow .node .collapsed-separator{stroke:hsl(30, 10%, 90%);stroke-width:0.75px;}#docs-flow div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Learn Sans;font-size:12px;background:hsl(30, 50%, 100%);border:1px solid hsl(30, 10%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#docs-flow .flowchartTitleText{text-anchor:middle;font-size:18px;fill:rgb(23, 43, 70);}#docs-flow rect.text{fill:none;stroke-width:0;}#docs-flow .icon-shape,#docs-flow .image-shape{background-color:rgb(255, 255, 255);text-align:center;}#docs-flow .icon-shape p,#docs-flow .image-shape p{background-color:rgb(255, 255, 255);padding:2px;}#docs-flow .icon-shape .label rect,#docs-flow .image-shape .label rect{opacity:0.5;background-color:rgb(255, 255, 255);fill:rgb(255, 255, 255);}#docs-flow .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#docs-flow .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#docs-flow .node .neo-node{stroke:rgb(22, 78, 137);}#docs-flow [data-look="neo"].node rect,#docs-flow [data-look="neo"].cluster rect,#docs-flow [data-look="neo"].node polygon{stroke:url(#docs-flow-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#docs-flow [data-look="neo"].swimlane.cluster rect{filter:none;}#docs-flow [data-look="neo"].node path{stroke:url(#docs-flow-gradient);stroke-width:1px;}#docs-flow [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#docs-flow [data-look="neo"].node .neo-line path{stroke:rgb(22, 78, 137);filter:none;}#docs-flow [data-look="neo"].node circle{stroke:url(#docs-flow-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#docs-flow [data-look="neo"].node circle .state-start{fill:#000000;}#docs-flow [data-look="neo"].icon-shape .icon{fill:url(#docs-flow-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#docs-flow [data-look="neo"].icon-shape .icon-neo path{stroke:url(#docs-flow-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#docs-flow :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="docs-flow_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="docs-flow_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="docs-flow_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 