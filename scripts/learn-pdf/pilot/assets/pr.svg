<svg id="pr" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 907.859375px;" viewBox="4 4 907.859375 77.796875" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#pr{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#pr .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#pr .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#pr .error-icon{fill:hsl(30, 50%, 100%);}#pr .error-text{fill:#000000;stroke:#000000;}#pr .edge-thickness-normal{stroke-width:1px;}#pr .edge-thickness-thick{stroke-width:3.5px;}#pr .edge-pattern-solid{stroke-dasharray:0;}#pr .edge-thickness-invisible{stroke-width:0;fill:none;}#pr .edge-pattern-dashed{stroke-dasharray:3;}#pr .edge-pattern-dotted{stroke-dasharray:2;}#pr .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#pr .marker.cross{stroke:rgb(22, 78, 137);}#pr svg{font-family:Learn Sans;font-size:30px;}#pr p{margin:0;}#pr .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#pr .cluster-label text{fill:#000000;}#pr .cluster-label span{color:#000000;}#pr .cluster-label span p{background-color:transparent;}#pr .label text,#pr span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#pr .node rect,#pr .node circle,#pr .node ellipse,#pr .node polygon,#pr .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#pr .rough-node .label text,#pr .node .label text,#pr .image-shape .label,#pr .icon-shape .label{text-anchor:middle;}#pr .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#pr .rough-node .label,#pr .node .label,#pr .image-shape .label,#pr .icon-shape .label{text-align:center;}#pr .node.clickable{cursor:pointer;}#pr .root .anchor path{fill:rgb(22, 78, 137)!important;stroke-width:0;stroke:rgb(