<svg id="variety-merge" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 419.59375px;" viewBox="0 0 419.59375 319.390625" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#variety-merge{font-family:Learn Sans;font-size:30px;fill:rgb(23, 43, 70);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#variety-merge .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#variety-merge .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#variety-merge .error-icon{fill:hsl(30, 50%, 100%);}#variety-merge .error-text{fill:#000000;stroke:#000000;}#variety-merge .edge-thickness-normal{stroke-width:1px;}#variety-merge .edge-thickness-thick{stroke-width:3.5px;}#variety-merge .edge-pattern-solid{stroke-dasharray:0;}#variety-merge .edge-thickness-invisible{stroke-width:0;fill:none;}#variety-merge .edge-pattern-dashed{stroke-dasharray:3;}#variety-merge .edge-pattern-dotted{stroke-dasharray:2;}#variety-merge .marker{fill:rgb(22, 78, 137);stroke:rgb(22, 78, 137);}#variety-merge .marker.cross{stroke:rgb(22, 78, 137);}#variety-merge svg{font-family:Learn Sans;font-size:30px;}#variety-merge p{margin:0;}#variety-merge .label{font-family:Learn Sans;color:rgb(23, 43, 70);}#variety-merge .cluster-label text{fill:#000000;}#variety-merge .cluster-label span{color:#000000;}#variety-merge .cluster-label span p{background-color:transparent;}#variety-merge .label text,#variety-merge span{fill:rgb(23, 43, 70);color:rgb(23, 43, 70);}#variety-merge .node rect,#variety-merge .node circle,#variety-merge .node ellipse,#variety-merge .node polygon,#variety-merge .node path{fill:rgb(237, 243, 249);stroke:rgb(22, 78, 137);stroke-width:1px;}#variety-merge .rough-node .label text,#variety-merge .node .label text,#variety-merge .image-shape .label